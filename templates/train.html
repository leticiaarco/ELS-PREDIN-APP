<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Model Training & Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --primary-blue: #0d6efd;
      --soft-bg: #f5f7fb;
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    body {
      background-color: var(--soft-bg);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #334155;
    }
    
    .container { max-width: 1100px; }
    
    .brand-header {
      padding: 40px 0 30px 0;
      display: flex;
      align-items: center; 
      gap: 30px;           
    }

    .stai-face-logo {
      width: 100px;        /* Slightly smaller for inner pages */
      height: 100px;       
      object-fit: contain; 
      background: white;
      padding: 10px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      margin-top: -15px;    /* Moves logo slightly to top as requested */
    }

    .heading-group {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    h1 {
      font-weight: 800;
      color: #1a1a1a;
      margin: 0;
      line-height: 1.1;
      font-size: 2.2rem;
    }  
    .card {
      border-radius: 20px;
      border: none;
      box-shadow: var(--card-shadow);
      margin-bottom: 1.5rem;
      background: #ffffff;
    }

    .form-control, .form-select {
      border-radius: 12px;
      padding: 0.75rem 1rem;
      border: 1px solid #dee2e6;
    }

    .btn-primary {
      background-color: var(--primary-blue);
      border: none;
      border-radius: 30px;
      padding: 0.6rem 2rem;
      font-weight: 600;
    }

    .btn-outline-secondary {
      border-radius: 30px;
      padding: 0.6rem 1.5rem;
      border: 1px solid #ced4da;
    }

    #model-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .model-box {
      background: white;
      border-radius: 20px;
      padding: 1.5rem;
      border: 1px solid #dee2e6;
      position: relative; /* Needed to position the delete icon */
    }

    /* Delete Button Styling */
    .delete-btn {
      position: absolute;
      top: 23px;
      right: 10px;
      color: #cbd5e1;
      cursor: pointer;
      transition: color 0.2s;
      font-size: 1.1rem;
    }

    .delete-btn:hover {
      color: #ef4444; /* Red on hover */
    }
      
    .model-date {
      margin-left: auto; 
      margin-right: 20px;
    }

    .status-badge {
      font-size: 0.7rem;
      padding: 4px 12px;
      border-radius: 20px;
      background: #e0e7ff;
      color: #4338ca;
      font-weight: bold;
    }

    .active-model {
      border: 2px solid #22c55e;
      background: #f0fdf4;
    }

    .modal-content { border-radius: 28px; padding: 1.5rem; border: none; }
    .modal-header { border-bottom: none; }
    .modal-footer { border-top: none; }
  </style>
</head>

<body>
<div class="container pb-5">
  
  <header class="brand-header">
    <img src="{{ url_for('static', filename='images/stai_logo_face.png') }}" 
         alt="STAI Face Logo" class="stai-face-logo">
    
    <div class="heading-group">
        <h1>Model Training & Optimization</h1>
    </div>

    <div>
        <a href="/" class="btn btn-outline-secondary btn-sm">← Home</a>
    </div>
  </header>

  <div class="card p-4">
    <h6 class="text-muted fw-bold mb-3">1. Dataset</h6>
    <div id="session-dataset-banner" class="alert alert-success py-2 px-3 mb-3" style="display:none;">
      <span id="session-dataset-label"></span>
      <span class="text-muted small ms-2">— loaded from Get Started</span>
    </div>
    <div class="row g-3">
        <div class="col-md-10">
            <label class="form-label small text-muted">Upload a different file (optional)</label>
            <input type="file" id="dataset-file" class="form-control" accept=".csv">
        </div>
        <div class="col-md-2">
            <div id="dataset-info" class="small text-success mt-2 fw-bold"></div>
        </div>
    </div>
    <div id="dataset-messages" class="mt-2"></div>
  </div>

  <div class="card p-4">
    <h6 class="text-muted fw-bold mb-3">2. Training Configuration</h6>
    <div class="row align-items-end g-3">
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label small fw-bold">Select Country</label>
          <select id="country" class="form-select">
            <option value="Belgium">Belgium</option>
            <option value="Italy">Italy</option>
            <option value="Portugal">Portugal</option>
            <option value="Iceland">Iceland</option>
            <option value="Cyprus">Cyprus</option>
            <option value="Romania">Romania</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label small fw-bold">
            Select Target Column
            <span tabindex="0"
                  data-bs-toggle="tooltip"
                  data-bs-placement="top"
                  title="Select the column that shows each student's final status (Dropped Out or Enrolled). The model will use this as the outcome to predict."
                  style="cursor:help; color:#6c757d;">&#9432;</span>
          </label>
          <select id="target-column" class="form-select">
            <option value="">Upload dataset first</option>
          </select>
        </div>
      </div>
      <div class="col-md-4">
        <label class="form-label small fw-bold">Select Model</label>
        <select id="model-name" class="form-select">
          <option value="logistic_regression">Logistic Regression</option>
          <option value="decision_tree">Decision Tree</option>
          <option value="random_forest">Random Forest</option>
          <option value="xgboost" selected>XGBoost</option>
          <option value="neural_network">Neural Network</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-outline-secondary w-100" data-bs-toggle="modal" data-bs-target="#settingsModal">
          Advanced Settings
        </button>
      </div>
      <div class="col-md-5 text-end">
        <button class="btn btn-primary px-5" id="train-btn">Start Training</button>
      </div>
    </div>
  </div>

  <h5 class="fw-bold mb-3">Trained Models</h5>
  <div id="model-list"></div>
</div>

<div class="modal fade" id="settingsModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-lg">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="modalTitle">Settings</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="params-container" class="row g-3"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary w-100" data-bs-dismiss="modal">Save Parameters</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let CURRENT_DATASET_ID = null;

const modelConfigs = {
  logistic_regression: [
    { key: "max_iter", label: "Max Iterations", type: "number", default: 2000 },
    { key: "C", label: "Regularization (C)", type: "number", default: 1.0, step: 0.1 },
    { key: "solver", label: "Solver", type: "text", default: "lbfgs" }
  ],
  decision_tree: [
    { key: "max_depth", label: "Max Depth", type: "number", default: 10 },
    { key: "min_samples_split", label: "Min Samples Split", type: "number", default: 2 },
    { key: "random_state", label: "Random State", type: "number", default: 42 }
  ],
  random_forest: [
    { key: "n_estimators", label: "Number of Trees", type: "number", default: 300 },
    { key: "max_depth", label: "Max Depth", type: "number", default: 15 },
    { key: "min_samples_split", label: "Min Samples Split", type: "number", default: 2 },
    { key: "random_state", label: "Random State", type: "number", default: 42 }
  ],
  xgboost: [
    { key: "n_estimators", label: "Boost Rounds", type: "number", default: 400 },
    { key: "learning_rate", label: "Learning Rate", type: "number", default: 0.05, step: 0.01 },
    { key: "max_depth", label: "Max Depth", type: "number", default: 5 },
    { key: "subsample", label: "Subsample", type: "number", default: 0.9, step: 0.1 },
    { key: "colsample_bytree", label: "Colsample By Tree", type: "number", default: 0.9, step: 0.1 },
    { key: "random_state", label: "Random State", type: "number", default: 42 }
  ],
  neural_network: [
    { key: "hidden_layer_sizes", label: "Hidden Layers (e.g. 64,32)", type: "text", default: "64, 32" },
    { key: "activation", label: "Activation", type: "text", default: "relu" },
    { key: "learning_rate_init", label: "Initial Learning Rate", type: "number", default: 0.001, step: 0.0001 },
    { key: "max_iter", label: "Max Iterations", type: "number", default: 500 }
  ]
};

function renderParams() {
  const model = document.getElementById("model-name").value;
  const container = document.getElementById("params-container");
  document.getElementById("modalTitle").innerText = model.toUpperCase().replace('_',' ') + " Settings";
  container.innerHTML = "";

  const config = modelConfigs[model] || [];
  config.forEach(p => {
    container.innerHTML += `
      <div class="col-12">
        <label class="form-label small fw-bold mb-1">${p.label}</label>
        <input type="${p.type}" class="form-control param-input" data-key="${p.key}" value="${p.default}" step="${p.step || 1}">
      </div>`;
  });
}

async function uploadDataset() {
  const fileInput = document.getElementById("dataset-file");
  if (!fileInput.files.length) return;
  const formData = new FormData();
  formData.append("file", fileInput.files[0]);
  const res = await fetch("/api/datasets/upload", { method: "POST", body: formData });
  const data = await res.json();
  CURRENT_DATASET_ID = data.dataset_id;
  const targetSelect = document.getElementById("target-column");
  targetSelect.innerHTML = "";

  data.columns.forEach(col => {
    targetSelect.innerHTML += `<option value="${col}">${col}</option>`;
  });
  document.getElementById("dataset-info").textContent = "File Ready";
}

async function trainModel() {
  if (!CURRENT_DATASET_ID) { alert("Upload data first"); return; }
  const params = {};
  document.querySelectorAll(".param-input").forEach(i => {
    let val = i.value;
    if (i.type === "number") val = parseFloat(val);
    params[i.dataset.key] = val;
  });

  const btn = document.getElementById("train-btn");
  btn.disabled = true; btn.innerText = "Training...";

  await fetch("/api/train_model", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      dataset_id: CURRENT_DATASET_ID,
      model_name: document.getElementById("model-name").value,
      target_column: document.getElementById("target-column").value,
      country: document.getElementById("country").value,
      params: params
    })
  });

  btn.disabled = false; btn.innerText = "Start Training";
  const target = document.getElementById("target-column").value;
  if (!target) {
    alert("Select target column");
    return;
  }
  loadModels();
}

async function loadModels() {
  const res = await fetch("/api/models");
  const data = await res.json();
  const list = document.getElementById("model-list");
  list.innerHTML = "";
  data.models.forEach(m => {
    const card = document.createElement("div");
    const isActive = data.active_model_id === m.model_id;
    card.className = "model-box " + (isActive ? "active-model" : "");
    card.innerHTML = `
      <i class="bi bi-trash delete-btn" onclick="deleteModel('${m.model_id}')" title="Delete Model"></i>

      <div class="d-flex justify-content-between align-items-start mb-2">
        <span class="status-badge">${m.metadata.model_name}</span>
        <span class="small text-muted pt-1 model-date" style="font-size: 0.75rem;">
          ${new Date(m.metadata.created_at).toLocaleDateString()}
        </span>
      </div>

      <h4 class="fw-bold mb-0">Accuracy: ${(m.metrics.accuracy * 100).toFixed(1)}%</h4>
      <p class="small text-muted mb-4">Country: ${m.metadata.country || "N/A"}</p>

      <div class="d-flex gap-2">
        <button 
          class="btn ${isActive ? 'btn-success' : 'btn-primary'} btn-sm flex-grow-1"
          ${isActive ? "disabled" : ""}
          onclick="activateModel('${m.model_id}', '${m.metadata.model_name}')">
          ${isActive ? "Activated" : "Activate"}
        </button>
        <a href="/api/models/${m.model_id}/download" class="btn btn-outline-secondary btn-sm flex-grow-1">Download</a>
      </div>
    `;
    list.appendChild(card);
  });
}

async function activateModel(id, name) {
  const res = await fetch(`/api/models/${id}/activate`, { method: "POST" });
  if (res.ok) {
      loadModels();
  }
}

async function deleteModel(id) {
  if (confirm("Are you sure you want to delete this model? This cannot be undone.")) {
    const res = await fetch(`/api/models/${id}`, { method: "DELETE" });
    const data = await res.json();
    if (data.status === "success") {
        loadModels(); // Refresh the list
    } else {
        alert("Error deleting model: " + data.message);
    }
  }
}

document.getElementById("model-name").addEventListener("change", renderParams);
document.getElementById("dataset-file").addEventListener("change", uploadDataset);
document.getElementById("train-btn").addEventListener("click", trainModel);
document.addEventListener("DOMContentLoaded", () => {
  renderParams();
  loadModels();
  loadSessionDataset();
  document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));
});

async function loadSessionDataset() {
  const res = await fetch("/api/session-dataset");
  const data = await res.json();
  if (!data.dataset_id) return;
  CURRENT_DATASET_ID = data.dataset_id;
  const targetSelect = document.getElementById("target-column");
  targetSelect.innerHTML = "";
  data.columns.forEach(col => {
    targetSelect.innerHTML += `<option value="${col}">${col}</option>`;
  });
  if (data.columns.length) targetSelect.value = data.columns[data.columns.length - 1];
  document.getElementById("session-dataset-banner").style.display = "block";
  document.getElementById("session-dataset-label").textContent = data.filename;
}
</script>
</body>
</html>
