    <style>
        body {
            min-height: 100vh;
            background-color: #f7f9fc;
            color: #333;
            font-family: 'Poppins', sans-serif;
            padding-top: 60px;
        }
        
        .wizard-card {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            padding: 50px;
            border: 1px solid #d1d9e0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        
        h2 {
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 40px;
            font-size: 1.8rem;
        }
        /* Sticker Card Styling */
        
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .option-card {
            background: #f0f7ff;
            border-radius: 20px;
            padding: 20px;
            cursor: pointer;
            border: 1px solid #e0e7ff;
            transition: all 0.2s ease;
        }
        
        .option-card:hover {
            background: #e6f1ff;
            transform: translateY(-3px);
        }
        
        .option-card.selected {
            border: 2px solid #007bff;
            background: #ffffff;
        }
        /* FIX: Removes the white background from snipped images */
        
        .option-icon {
            width: 85px;
            height: 85px;
            object-fit: contain;
            margin-bottom: 15px;
            mix-blend-mode: multiply;
            /* This makes white backgrounds transparent! */
        }
        
        .option-label {
            font-weight: 600;
            font-size: 0.95rem;
        }
        /* Action Buttons Row */
        
        .actions-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .btn-next {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 60px;
            /* Longer button */
            font-weight: 600;
            transition: background 0.2s;
        }
        
        .btn-next:disabled {
            background-color: #ccc;
        }
        
        .btn-skip {
            background-color: #f8f9fa;
            color: #6c757d;
            border: 1px solid #dee2e6;
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: 600;
        }
        /* Back Home at the bottom */
        
        .bottom-nav {
            margin-top: 40px;
            display: block;
        }
        
        .btn-back-link {
            color: #6c757d;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .btn-back-link:hover {
            text-decoration: underline;
        }
        
        .wizard-logo-container {
            text-align: center;
            margin-bottom: 20px;
            /* Space between logo and card */
        }
        
        .stai-face-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            background: white;
            padding: 8px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-top: -10px;
            /* Your requested upward nudge */
            transition: transform 0.2s;
        }
        
        .stai-face-logo:hover {
            transform: scale(1.05);
        }
        /* Dropdown/Text Centering */
        
        #input-container {
            max-width: 450px;
            margin: 0 auto 30px;
        }
    </style>
</head>

        function renderStep() {
            currentScreen = "questions";
            const step = QUESTIONS[stepIndex];

            document.getElementById("options").innerHTML = "";
            document.getElementById("input-container").innerHTML = "";
            document.getElementById("next-btn").disabled = true;

            document.getElementById("question-title").innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="margin:0;">${step.question}</h2>
      <span style="
        font-size: 0.75rem;
        background:#eef2ff;
        padding:6px 12px;
        border-radius:20px;
        font-weight:600;
        color:#4f46e5;">
        Student ${currentStudentIndex + 1} of ${totalStudents}
      </span>
    </div>
  `;

            if (step.type === "select") renderDropdown(step);
            else if (step.type === "text") renderText(step);
            else renderCards(step);
        }

        function renderCards(step) {
            const optionsDiv = document.getElementById("options");

            step.options.forEach(opt => {
                        const card = document.createElement("div");
                        card.className = "option-card";

                        if (answers[step.feature] === opt.value) {
                            card.classList.add("selected");
                            document.getElementById("next-btn").disabled = false;
                        }

                        card.innerHTML = `
      ${opt.icon ? `<img src="/static/icons/${opt.icon}" class="option-icon">` : ""}
      <div class="option-label">${opt.label}</div>
    `;

    card.onclick = () => {
      document.querySelectorAll(".option-card").forEach(c => c.classList.remove("selected"));
      card.classList.add("selected");
      answers[step.feature] = opt.value;
      document.getElementById("next-btn").disabled = false;
    };

    optionsDiv.appendChild(card);
  });
}

// Ensure the skip button still functions correctly

  answers[QUESTIONS[stepIndex].feature] = null;
  nextStep();
};

document.getElementById("next-btn").onclick = nextStep;

function renderDropdown(step) {
  const container = document.getElementById("input-container");

  container.innerHTML = `
    <select class="form-select" id="dropdown">
      <option value="">Choose...</option>
      ${step.options.map(o => `
        <option value="${o.value}" ${answers[step.feature] === o.value ? "selected" : ""}>
          ${o.label}
        </option>
      `).join("")}
    </select>
  `;

  document.getElementById("dropdown").onchange = (e) => {
    answers[step.feature] = e.target.value || null;
    document.getElementById("next-btn").disabled = !e.target.value;
  };
}

document.getElementById("back-btn").onclick = () => {
  if (stepIndex > 1) {
    stepIndex--;
    answers = { ...allAnswers[stepIndex] };
    renderStep();
  } else if (stepIndex === 1) {
    // If we are at the first question of the wizard, go back to mode selection
    askMode();
  }
};
function askCountry() {
  currentScreen = "country";
  const step = QUESTIONS[0]; // The Country object

  document.getElementById("question-title").innerHTML = `<h2>${step.question}</h2>`;
  document.getElementById("options").innerHTML = "";
  document.getElementById("input-container").innerHTML = "";
  // Hide back button on the very first screen
  document.getElementById("back-btn").style.display = "none";

  step.options.forEach(opt => {
    const card = document.createElement("div");
    card.className = "option-card";

    // FIX: Added the icon rendering logic here
    card.innerHTML = `
      ${opt.icon ? `<img src="/static/icons/${opt.icon}" class="option-icon">` : ""}
      <div class="option-label">${opt.label}</div>
    `;

    card.onclick = () => {
      globalCountry = opt.value;
      // After selecting country, show the back button and go to input method
      document.getElementById("back-btn").style.display = "inline-block";
      askInputMethod(); 
    };

    document.getElementById("options").appendChild(card);
  });
}
 
// STEP 1 → number of students
function askStudentCount() {
  currentScreen = "student_count";
  document.getElementById("question-title").innerHTML = "<h2>How many students?</h2>";

  document.getElementById("options").innerHTML = "";
  document.getElementById("input-container").innerHTML = `
    <input type="number" id="student-count" class="form-control" min="1" max="200">
    <br>
    <button class="btn btn-primary" onclick="confirmStudentCount()">Continue</button>
  `;
}

function confirmStudentCount() {
  const val = parseInt(document.getElementById("student-count").value);

  if (!val || val < 1) {
    alert("Enter valid number");
    return;
  }

  totalStudents = val;
  // FIX 1: If 1 student entered, skip asking "Same or Different" mode
  if (totalStudents === 1) {
    setMode('same');
  } else {
    askMode();
  }
}

// STEP 2 → same or different
function askMode() {
  currentScreen = "mode";
  document.getElementById("question-title").innerHTML = "<h2>Student setup</h2>";

  document.getElementById("input-container").innerHTML = "";
  document.getElementById("options").innerHTML = `
    <div class="option-card" onclick="setMode('same')">
      <div class="option-label">Same for all students</div>
    </div>
    <div class="option-card" onclick="setMode('different')">
      <div class="option-label">Different per student</div>
    </div>
  `;
}

function setMode(selected) {
  mode = selected;

  allStudents = [];
  allAnswers = [];
  answers = {};
  currentStudentIndex = 0;

  startQuestions();
}


function startQuestions() {
  stepIndex = 1;
  renderStep();
}

function nextStep() {
  allAnswers[stepIndex] = { ...answers };

  stepIndex++;

  if (stepIndex < QUESTIONS.length) {
    renderStep();
  } else {
    saveStudent();
  }
}

document.getElementById("next-btn").onclick = nextStep;

document.getElementById("skip-btn").onclick = () => {
  answers[QUESTIONS[stepIndex].feature] = null;
  nextStep();
};

document.getElementById("back-btn").onclick = () => {

  if (currentScreen === "input_method") {
    askCountry();   //  go back to country
    return;
  }

  if (currentScreen === "student_count") {
    askInputMethod();   //  go back to method selection
    return;
  }

  if (currentScreen === "mode") {
    askStudentCount();  //  go back to count
    return;
  }

  if (stepIndex > 1) {
    stepIndex--;
    delete answers[QUESTIONS[stepIndex].feature]; // drop value so user re-enters it
    renderStep();
  } else {
    if (totalStudents === 1) {
      askStudentCount();
    } else {
      askMode();
    }
  }
};

function saveStudent() {
  let payload = buildStudentPayload();
  payload.country = globalCountry;

  if (mode === "same") {
    for (let i = 0; i < totalStudents; i++) {
      allStudents.push({ ...payload });
    }
    finishPrediction();
  } else {
    allStudents.push({ ...payload });
    currentStudentIndex++;

    if (currentStudentIndex < totalStudents) {
      answers = {};
      allAnswers = [];
      stepIndex = 1;
      renderStep();
    } else {
      finishPrediction();
    }
  }
}

function renderText(step) {
  const container = document.getElementById("input-container");

  container.innerHTML = `
    <input type="text" class="form-control"
      id="text-input"
      value="${answers[step.feature] || ""}"
      placeholder="${step.placeholder || ''}">
  `;

  document.getElementById("text-input").oninput = (e) => {
    answers[step.feature] = e.target.value.trim() || null;
    document.getElementById("next-btn").disabled = false;
  };
}


document.getElementById("next-btn").onclick = nextStep;
document.getElementById("skip-btn").onclick = () => {
  answers[QUESTIONS[stepIndex].feature] = null;
  nextStep();
};

async function finishPrediction() {
  document.getElementById("question-title").innerHTML = "<h2>Processing...</h2>";
  document.getElementById("options").innerHTML = "";
  document.getElementById("input-container").innerHTML = "";

  try {
    const response = await fetch("/api/predict", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ students: allStudents, use_llm: useLLM })
    });

    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(errorText);
    }

    const data = await response.json();
    showPredictionSummary(data);

  } catch (error) {
    console.error("Prediction error:", error);
    alert("Prediction failed. Please check your input.");
  }
}

      <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" role="switch" id="llm-toggle"
          ${useLLM ? "checked" : ""}
          onchange="useLLM = this.checked; document.getElementById('llm-toggle-label').textContent = this.checked ? 'AI Explanations: On' : 'AI Explanations: Off';">
        <label class="form-check-label fw-semibold" id="llm-toggle-label" for="llm-toggle"
          style="cursor:pointer;">
          ${useLLM ? "AI Explanations: On" : "AI Explanations: Off"}
        </label>
      </div>
      <span style="font-size:0.78rem; color:#6c757d; margin-left:0.5rem;">
        (Requires local Ollama. Disable if not available.)
      </span>
    </div>
  `;

  //  Belgium → Manual + CSV
  if (globalCountry === "Belgium") {
    document.getElementById("options").innerHTML = `
      <div class="option-card" onclick="askStudentCount()">
        <div class="option-label">Manual Entry</div>
      </div>

      <div class="option-card" onclick="showCSVUpload()">
        <div class="option-label">Upload CSV File</div>
      </div>
    `;
  } 
  //  Other countries → ONLY CSV
  else {
    document.getElementById("options").innerHTML = `
      <div class="option-card" onclick="showCSVUpload()">
        <div class="option-label">Upload CSV File</div>
      </div>
    `;
  }
}

function showCSVUpload() {
  document.getElementById("question-title").innerHTML = "<h2>Upload CSV File</h2>";

  document.getElementById("options").innerHTML = "";
  document.getElementById("input-container").innerHTML = `
    <input type="file" id="csv-file" accept=".csv" class="form-control mb-3">
    <br>
    <button class="btn btn-primary" onclick="uploadCSV()">Upload & Predict</button>
  `;
}

function uploadCSV() {
  const fileInput = document.getElementById("csv-file");
  const file = fileInput.files[0];

  if (!file) {
    alert("Please select a CSV file.");
    return;
  }

  const reader = new FileReader();

  reader.onload = async function (event) {
    const csvText = event.target.result;

    // Parse CSV
    const lines = csvText.trim().split("\n");
    const headers = lines[0].split(",").map(h => h.trim());

    const students = [];

    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;

      const values = lines[i].split(",").map(v => v.trim());
      const student = {};

      headers.forEach((header, index) => {
        const value = values[index];
        student[header] = value === "" ? null : isNaN(value) ? value : Number(value);
      });

      students.push(student);
    }

    if (students.length === 0) {
      alert("The CSV file is empty or invalid.");
      return;
    }

    try {
      const response = await fetch("/api/predict", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ students, use_llm: useLLM })
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText);
      }

      const data = await response.json();
      showPredictionSummary(data);

    } catch (error) {
      console.error("Prediction error:", error);
      alert("Prediction failed. Please check your CSV format.");
    }
  };

  reader.readAsText(file);
}

function showPredictionSummary(data) {
  const rows = data.summary || [];

  if (!rows.length) {
    alert("No prediction results returned.");
    return;
  }

  const total = rows.length;
  const dropoutCount = rows.filter(r => r.prediction === "Dropout").length;
  const enrollCount = total - dropoutCount;

  let tableRows = rows.map(row => `
    <tr>
      <td>${row.student_row}</td>
      <td>
        <span class="badge ${row.prediction === "Dropout" ? "bg-danger" : "bg-success"}">
          ${row.prediction}
        </span>
      </td>
      <td>${row.probability !== null && row.probability !== undefined ? (row.probability * 100).toFixed(1) + "%" : "N/A"}</td>
      <td>${row.llm_risk_summary || ""}</td>
      <td>${row.llm_intervention_summary || ""}</td>
    </tr>
  `).join("");

  document.querySelector(".wizard-card").style.maxWidth = "1200px";

  document.querySelector(".wizard-card").innerHTML = `
    <h2 class="mb-3">Prediction Summary</h2>

    <div class="row text-center mb-4">
      <div class="col-md-4">
        <div class="p-3 bg-light rounded-4 border">
          <div class="text-muted small">Total Students</div>
          <h4 class="mb-0">${total}</h4>
        </div>
      </div>
      <div class="col-md-4">
        <div class="p-3 bg-light rounded-4 border">
          <div class="text-muted small">Dropout Risk</div>
          <h4 class="mb-0 text-danger">${dropoutCount}</h4>
        </div>
      </div>
      <div class="col-md-4">
        <div class="p-3 bg-light rounded-4 border">
          <div class="text-muted small">Enroll / Low Risk</div>
          <h4 class="mb-0 text-success">${enrollCount}</h4>
        </div>
      </div>
    </div>

    <div class="table-responsive text-start">
      <table class="table table-bordered align-middle">
        <thead class="table-light">
          <tr>
            <th>Student</th>
            <th>Risk</th>
            <th>Probability</th>
            <th>${useLLM ? "AI Explanation" : "Risk Summary"}</th>
            <th>${useLLM ? "AI Suggested Action" : "Suggested Action"}</th>
          </tr>
        </thead>
        <tbody>
          ${tableRows}
        </tbody>
      </table>
    </div>

    <div class="mt-4 d-flex justify-content-center gap-3 flex-wrap">
      <a href="${data.summary_csv_url}" class="btn btn-primary">
        Download Summary CSV
      </a>

      <a href="${data.technical_csv_url}" class="btn btn-outline-secondary">
        Download Technical CSV
      </a>

      <button class="btn btn-outline-primary" onclick="location.reload()">
        New Prediction
      </button>
    </div>

    <div class="alert alert-warning text-start mt-4">
        <strong>Important:</strong>
        These predictions are decision-support only. They should not be used as the sole basis for decisions about a student. Educational staff should combine this output with professional judgment, student context, and institutional policy.
    </div>
  `;
}


document.getElementById("input-container").innerHTML += `
  <br>
  <a href="/static/sample_template.csv" download>
    Download CSV Template
  </a>
`;


async function checkActiveModel() {
  try {
    // 1. Get all models
    const resModels = await fetch("/api/models");
    const dataModels = await resModels.json();

    // 2. Get active model ID
    const resStatus = await fetch("/api/models/active_status");
    const dataStatus = await resStatus.json();

    const activeId = dataStatus.active_id;
    const nameDisplay = document.getElementById("active-model-name");

    //  CASE 1: Active model exists
    if (activeId) {
      const activeModel = dataModels.models.find(m => m.model_id === activeId);

      if (activeModel) {
        nameDisplay.innerText = activeModel.metadata.model_name
          .replace(/_/g, ' ')
          .toUpperCase();

        nameDisplay.classList.remove("text-danger");
        nameDisplay.classList.add("text-primary");

        return true;   //  RETURN TRUE HERE
      }
    }

    //  CASE 2: No active model
    nameDisplay.innerText = "None Activated";
    nameDisplay.classList.remove("text-primary");
    nameDisplay.classList.add("text-danger");

    //  Show blocking UI
    document.getElementById("options").innerHTML = "";
    document.getElementById("input-container").innerHTML = "";

    document.getElementById("question-title").innerHTML = `
      <h2>No Active Model Found</h2>
      <p style="color:#6b7280; font-size:0.95rem;">
        Please train and activate a model before making predictions.
      </p>
      <br>
      <a href="/train" class="btn btn-primary">Go to Training Page</a>
    `;

    // Hide buttons
    document.getElementById("next-btn").style.display = "none";
    document.getElementById("skip-btn").style.display = "none";
    document.getElementById("back-btn").style.display = "none";

    return false;   //  RETURN FALSE HERE

  } catch (e) {
    console.error("Status check failed", e);

    document.getElementById("active-model-name").innerText = "Status Unknown";

    return false;   //  ALSO RETURN FALSE ON ERROR
  }
}
// Call it when page loads
document.addEventListener("DOMContentLoaded", async () => {
  const hasModel = await checkActiveModel();
  if (hasModel) {
    askCountry();
  }
});

function ordinal(n) {
  if (n === 1) return "1st";
  if (n === 2) return "2nd";
  if (n === 3) return "3rd";
  return `${n}th`;
}

function buildStudentPayload() {
  const payload = { ...answers };
  if (answers.grade && answers.year) {
    payload.grade_year_secondary = `${ordinal(answers.grade)} Grade - ${ordinal(answers.year)} Year`;
  }
  payload.grade_secondary_education = answers.grade ?? null;
  payload.school_year_level = answers.year ?? null;
  delete payload.grade;
  delete payload.year;
  return payload;
}

function showPrediction(result) {
  let label = result.prediction === 1 ? "⚠️ High dropout risk" : "✅ Low dropout risk";
  let prob = result.probability !== null ? `Confidence Level: ${(result.probability * 100).toFixed(1)}%` : "";

  document.querySelector(".wizard-card").innerHTML = `
    <h2 class="mb-4">Prediction results</h2>
    <div class="alert ${result.prediction === 1 ? "alert-danger" : "alert-success"} p-4" style="border-radius: 20px;">
      <h3 class="mb-2">${label}</h3>
      <p class="mb-0">${prob}</p>
    </div>
    <div class="mt-4">
        <button class="btn btn-primary" onclick="location.reload()">New Prediction</button>
        <br><br>
        <a href="/" class="btn btn-outline-secondary btn-sm">← Home</a>
    </div>
  `;
}
